<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QA Result</title>
<style>
	html, body {
  height: 100%;
  margin: 0;
}
body {
  min-height: 100vh;
  background: #0f172a;
  color: #fff;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}
  body {
    background: #0f172a;
    color: #fff;
    font-family: monospace;
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  #result {
    font-size: 1.3rem;
    max-width: 700px;
    line-height: 1.5;
    margin-bottom: 40px;
  }
  a {
    color: #3b82f6;
    text-decoration: none;
    border: 1px solid #3b82f6;
    padding: 10px 20px;
    border-radius: 6px;
  }
  a:hover {
    background: #3b82f6;
    color: #000;
  }
</style>
</head>
<body>
  <div id="result">Loading result...</div>
  <a href="https://www.asellecunningham.com/">Visit My Portfolio Website</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const result = params.get("result");
    document.getElementById("result").textContent = result || "No result provided.";
  </script>
</body>
</html>
